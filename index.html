<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.4,user-scalable=yes">
<title>小银英语 · 跟AI外教轻松开口</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1e293b;--muted:#64748b;--primary:#e0553a;--primary-dark:#c9402a;--green:#15803d;--line:#e2e8f0;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;}
header{background:linear-gradient(135deg,#e0553a,#d97706);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:9;}
header h1{font-size:22px;}
header .hbtn{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:16px;padding:8px 14px;border-radius:12px;}
main{max-width:520px;margin:0 auto;padding:14px 14px 30px;}
.big-btn{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;font-size:19px;font-weight:600;text-align:left;margin-bottom:10px;color:var(--text);}
.big-btn .em{font-size:30px;}
.big-btn small{display:block;font-size:14px;color:var(--muted);font-weight:400;margin-top:2px;}
.big-btn:active{background:#fff3ec;border-color:var(--primary);}
.sec-title{font-size:18px;font-weight:700;margin:16px 0 10px;}
/* 今日3句 */
#todayCard{background:linear-gradient(135deg,#fff7ed,#fde8d7);border:2px solid #f5c896;border-radius:18px;padding:16px;margin-bottom:6px;}
#todayCard h2{font-size:20px;margin-bottom:8px;}
.sen-row{background:#fff;border-radius:14px;padding:12px;margin:8px 0;}
.sen-row .en{font-size:19px;font-weight:700;line-height:1.4;}
.sen-row .cn{font-size:16px;color:var(--muted);margin-top:3px;}
.sen-row .hy{font-size:15px;color:#c9402a;margin-top:2px;}
.sen-row .ipa{font-size:14px;color:#7c3aed;font-family:serif;margin-top:2px;}
.sen-row .btns{display:flex;gap:8px;margin-top:8px;}
.mini-btn{border:none;border-radius:10px;padding:8px 14px;font-size:15px;font-weight:600;background:#eef2f7;color:#1e293b;}
.mini-btn.org{background:var(--primary);color:#fff;}
.mini-btn:active{opacity:.7;}
#doneToday{width:100%;border:none;border-radius:14px;padding:14px;font-size:19px;font-weight:700;background:var(--green);color:#fff;margin-top:10px;}
#doneToday:disabled{background:#cbd5e1;}
/* 日历 */
#calRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.cal-day{width:34px;height:34px;border-radius:50%;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);}
.cal-day.flower{background:#ffe4e0;font-size:18px;}
/* 对话页 */
#chatPage{display:none;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;}
#chatHead{background:linear-gradient(135deg,#e0553a,#d97706);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
#chatHead button{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:17px;padding:6px 12px;border-radius:10px;}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:92%;padding:12px 14px;border-radius:16px;font-size:19px;line-height:1.5;}
.msg.ai{background:var(--card);border:2px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
.msg.user{background:#e0553a;color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.msg .cn{display:block;font-size:16px;color:var(--muted);margin-top:4px;}
.msg.user .cn{color:#ffe0d6;}
.msg .sec{font-size:14px;color:#c9402a;margin-top:8px;font-weight:700;}
.drill-row{margin:8px 0;background:#f8fafc;border-radius:12px;padding:8px;}
.drill-row .den{font-size:18px;font-weight:700;}
.drill-row .dcn{font-size:15px;color:var(--muted);}
.drill-row .dhy{font-size:14px;color:#c9402a;}
.drill-row .dipa{font-size:13px;color:#7c3aed;font-family:serif;}
#inputBar{flex-shrink:0;background:#fff;border-top:2px solid var(--line);padding:10px 12px 14px;}
#quickRow{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;}
#quickRow button{flex-shrink:0;border:2px solid #f5c896;background:#fff7ed;border-radius:12px;padding:8px 14px;font-size:16px;font-weight:600;}
#micBtn{width:100%;border:none;border-radius:16px;padding:18px;font-size:21px;font-weight:700;background:var(--primary);color:#fff;margin-top:4px;}
#micBtn.holding{background:var(--primary-dark);transform:scale(.98);}
#typeRow{display:flex;gap:8px;margin-top:8px;}
#typeInput{flex:1;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:18px;}
#sendBtn{border:none;border-radius:12px;padding:10px 18px;font-size:18px;font-weight:700;background:#eef2f7;}
#confirmBox{display:none;background:#fff7ed;border:2px solid var(--primary);border-radius:14px;padding:12px;margin-top:8px;}
#confirmBox .txt{font-size:19px;font-weight:700;}
#confirmBox .btns{display:flex;gap:10px;margin-top:8px;}
#thinking{display:none;align-self:flex-start;color:var(--muted);font-size:16px;padding:8px 4px;}
/* 弹窗 */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;align-items:center;justify-content:center;padding:20px;}
.modal .box{background:#fff;border-radius:20px;padding:20px;max-width:420px;width:100%;max-height:85dvh;overflow-y:auto;}
.modal h3{font-size:20px;margin-bottom:12px;}
.rate-btn{display:block;width:100%;border:2px solid var(--line);border-radius:14px;padding:16px;font-size:19px;font-weight:700;margin-bottom:10px;background:#fff;}
.rate-btn.on{background:var(--primary);color:#fff;border-color:var(--primary);}
/* 炫耀卡 */
#cardPage{display:none;min-height:100dvh;background:linear-gradient(160deg,#e0553a,#d97706);padding:30px 18px;}
#shareCard{background:#fff;border-radius:22px;padding:24px;max-width:420px;margin:0 auto;text-align:center;}
#shareCard h2{font-size:24px;color:var(--primary);}
#shareCard .who{font-size:17px;color:var(--muted);margin-top:4px;}
#shareCard .lines{text-align:left;margin-top:14px;}
#shareCard .lines .en{font-size:20px;font-weight:700;margin-top:10px;}
#shareCard .lines .cn{font-size:16px;color:var(--muted);}
.tip-photo{color:#fff;text-align:center;font-size:18px;margin-top:16px;font-weight:600;}
.hidden{display:none!important;}
</style>
</head>
<body>
<header>
  <h1>🧓 小银英语</h1>
  <button class="hbtn" onclick="openSettings()">⚙️ 设置</button>
</header>

<main id="homePage">
  <div id="greetLine" style="font-size:18px;margin:6px 0 12px;"></div>
  <div id="todayCard">
    <h2>📋 今天的 3 句</h2>
    <div id="todayList"></div>
    <button id="doneToday" onclick="finishToday()">✅ 我都跟读过了，打卡！</button>
  </div>
  <div class="sec-title">🗓️ 我的坚持</div>
  <div id="calRow"></div>
  <div class="sec-title">💬 想聊天？Anna 随时都在</div>
  <button class="big-btn" onclick="startChat({id:'chat',title:'陪您聊聊天',emoji:'💬',goal:'',chat:true})" style="width:100%;border:2px dashed #f59e0b;background:#fffbeb;">
    <span class="em">☕</span><span>和 Anna 聊聊天<small>说中文就行，她还能教您两句英语</small></span>
  </button>
  <div class="sec-title">🎯 情景练一练（点一个开始）</div>
  <div id="sceneList"></div>
  <div style="height:14px"></div>
</main>

<div id="chatPage">
  <div id="chatHead">
    <button onclick="goHome()">← 回家</button>
    <div><div id="chatTitle" style="font-size:20px;font-weight:700;">Anna</div>
    <div id="chatSub" style="font-size:14px;opacity:.9;"></div></div>
  </div>
  <div id="msgs"><div id="thinking">…Anna 正在打字</div></div>
  <div id="inputBar">
    <div id="quickRow"></div>
    <button id="micBtn">🎤 按住说话（说英语）</button>
    <div id="confirmBox">
      <div style="font-size:14px;color:var(--muted);">您刚才说的是：</div>
      <div class="txt" id="confirmTxt"></div>
      <div class="btns">
        <button class="mini-btn org" id="okBtn">✅ 没错，发送</button>
        <button class="mini-btn" id="retryBtn">🔄 说错了，重说</button>
      </div>
    </div>
    <div id="typeRow">
      <input id="typeInput" placeholder="也可以打字（点这里用键盘语音）">
      <button id="sendBtn" onclick="sendText()">发送</button>
    </div>
  </div>
</div>

<div id="cardPage">
  <div id="shareCard"></div>
  <div class="tip-photo">📱 长按下方按钮复制文字，或截图发到家庭群</div>
  <div style="text-align:center;margin-top:14px;">
    <button class="mini-btn" style="padding:12px 22px;font-size:17px;" onclick="copyCard()">📋 复制文字</button>
    <button class="mini-btn" style="padding:12px 22px;font-size:17px;margin-left:8px;" onclick="goHome()">🏠 回家</button>
  </div>
</div>

<div class="modal" id="welcomeModal" style="background:#fff;z-index:200;align-items:flex-start;overflow-y:auto;">
  <div class="box" style="margin:30px auto;text-align:center;">
    <div style="font-size:52px;">👵🧓</div>
    <h3 style="font-size:24px;color:var(--primary);margin-top:8px;">您好啊！👋</h3>
    <div style="font-size:19px;line-height:1.7;margin-top:8px;">我是您的英语老师 <b>Anna</b>。<br>我应该怎么称呼您呢？</div>
    <button id="hearBtn" class="mini-btn org" style="margin:14px auto;display:block;padding:12px 24px;font-size:18px;" onclick="welHello()">🔊 点这里，听 Anna 说</button>
    <div id="welStep2" class="hidden">
      <div style="font-size:18px;margin:12px 0 6px;">按住下面的按钮，告诉我：<br><b>“我姓李”“我姓王”</b> 就可以啦</div>
      <button id="welMic" style="width:100%;border:none;border-radius:16px;padding:20px;font-size:20px;font-weight:700;background:var(--primary);color:#fff;">🎤 按住说话（说中文）</button>
      <div id="welResult" style="font-size:17px;margin-top:10px;color:var(--muted);"></div>
    </div>
    <div style="margin-top:16px;border-top:2px dashed var(--line);padding-top:14px;">
      <div style="font-size:15px;color:var(--muted);">不方便说话？手动填：</div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input id="welInput" placeholder="您的姓氏，如：李" style="flex:1;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:18px;">
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="mini-btn" style="flex:1;" onclick="welManual('f')">👩 我是女的（称阿姨）</button>
        <button class="mini-btn" style="flex:1;" onclick="welManual('m')">👨 我是男的（称叔叔）</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="box">
    <h3>⚙️ 设置</h3>
    <div style="font-size:16px;margin-bottom:8px;font-weight:700;">🗣️ Anna 说话速度</div>
    <button class="rate-btn" data-rate="slow" onclick="setRate('slow')">🐢 慢慢说（第一次学推荐）</button>
    <button class="rate-btn" data-rate="mid" onclick="setRate('mid')">🐢 慢一点（默认）</button>
    <button class="rate-btn" data-rate="fast" onclick="setRate('fast')">▶️ 正常语速</button>
    <div style="font-size:16px;margin:14px 0 8px;font-weight:700;">👋 Anna 怎么称呼您</div>
    <input id="nickInput" placeholder="您的姓氏，比如：李" style="width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:18px;">
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="mini-btn" id="gF" style="flex:1;padding:12px;" onclick="setGender('f')">👩 称阿姨</button>
      <button class="mini-btn" id="gM" style="flex:1;padding:12px;" onclick="setGender('m')">👨 称叔叔</button>
    </div>
    <div style="margin-top:14px;">
      <button class="mini-btn org" style="width:100%;padding:14px;font-size:18px;" onclick="saveSettings()">保存</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="mini-btn" style="flex:1;padding:10px;" onclick="voiceDiag()">🔊 语音诊断</button>
      <button class="mini-btn" style="flex:1;padding:10px;" onclick="micDiag()">🎤 麦克风诊断</button>
    </div>
    <details style="margin-top:12px;"><summary style="font-size:14px;color:var(--muted);">高级：填写自己的 AI 密钥</summary>
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
        <button class="mini-btn pf-btn" data-pf="zhipu" style="padding:8px 10px;" onclick="setPlatform('zhipu')">智谱GLM（免费✨推荐）</button>
        <button class="mini-btn pf-btn" data-pf="spark" style="padding:8px 10px;" onclick="setPlatform('spark')">讯飞星火（免费）</button>
        <button class="mini-btn pf-btn" data-pf="deepseek" style="padding:8px 10px;" onclick="setPlatform('deepseek')">DeepSeek（付费）</button>
      </div>
      <input id="keyInput" type="password" placeholder="粘贴 API 密钥（选填）" style="width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:14px;margin-top:8px;">
      <div id="pfHint" style="font-size:12px;color:var(--muted);margin-top:4px;"></div>
    </details>
  </div>
</div>

<script>

function $(id){return document.getElementById(id);}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

          if(v)u.voice=v;

/* 音频上下文：微信 XWeb 里 WebAudio 播放比 Audio 元素稳得多 */
let _actx=null;
function _getActx(){
  if(!_actx){try{_actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(_actx&&_actx.state==="suspended"){try{_actx.resume();}catch(e){}}
  return _actx;
}
function _decodePlay(buf,rate){
  return new Promise((res,rej)=>{
    const ctx=_getActx();
    if(!ctx)return rej(new Error("webaudio-no"));
    ctx.decodeAudioData(buf,b=>{
      try{
        const src=ctx.createBufferSource();
        src.buffer=b;
        src.playbackRate.value=rate?Math.min(1.5,Math.max(0.6,rate+0.15)):1;
        src.connect(ctx.destination);
        src.onended=()=>{_canAutoplay=true;res();};
        src.start();
      }catch(e){rej(e);}
    },err=>rej(new Error("decode-fail")));
    setTimeout(()=>rej(new Error("timeout")),12000);
  });
}
function _playUrl(url,rate){
  /* 路径1：fetch→WebAudio（微信最稳）；路径2：Audio 元素兜底。错误带类型不再吞 */
  const doFetch=()=>fetch(url,{mode:"cors",cache:"force-cache"}).then(r=>{
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.arrayBuffer();
  }).then(buf=>_decodePlay(buf,rate));
  const doAudio=()=>new Promise((res,rej)=>{
    const a=new Audio();
    a.playbackRate=rate?Math.min(1.5,Math.max(0.6,rate+0.15)):1;
    a.onended=()=>{_canAutoplay=true;res();};
    a.onerror=e=>{_canAutoplay=false;const er=e&&e.target&&e.target.error;rej(new Error(er?("audio-err"+er.code):"audio-error"));};
    a.src=url;
    a.play().then(()=>{}).catch(err=>{_canAutoplay=false;rej(new Error((err&&err.name)||"play-rejected"));});
    setTimeout(()=>rej(new Error("timeout")),12000);
  });
  return doFetch().catch(()=>doAudio());
}
function speakOnline(text,rate,quiet,lang){
  text=String(text).replace(/\s+/g," ").trim().slice(0,200);

  const tries=[
    ()=>edgeTTS(text,rate,voice).then(u=>_playUrl(u,rate)),
    ()=>_playUrl("https://tts.baidu.com/text2audio?tex="+encodeURIComponent(text)+"&cuid=se&lan="+(lan==="zh"?"zh":"en")+"&ctp=1&pdt=3011&vol=9",rate),

    ()=>{ if(lan!=="en")throw new Error("skip"); return _playUrl("https://dict.youdao.com/dictvoice?le=en&q="+encodeURIComponent(text),rate); }

function edgeTTS(text,rate,voice){
  return new Promise((resolve,reject)=>{
    const TRUSTED="6A5AA1D4EAFF4E9FB37E23D68491D6F4";
    if(!window.crypto||!crypto.subtle||!window.WebSocket){reject(new Error("unsupported"));return;}
    const V=voice||"en-US-AvaNeural";
    const VLANG=V.indexOf("zh")===0?"zh-CN":"en-US";
    const t=(BigInt(Math.floor(Date.now()/1000))+11644473600n)*10000000n;
    const rounded=(t/3000000000n)*3000000000n;
    crypto.subtle.digest("SHA-256",new TextEncoder().encode(rounded.toString()+TRUSTED)).then(hash=>{
      const gec=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("").toUpperCase();
      let ws;
      try{ws=new WebSocket("wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?TrustedClientToken="+TRUSTED+"&Sec-MS-GEC="+gec+"&Sec-MS-GEC-Version=1-131.0.2903.99");}
      catch(e){reject(e);return;}
      ws.binaryType="arraybuffer";
      ws.binaryType="arraybuffer";
      const chunks=[];let timer=setTimeout(()=>{try{ws.close();}catch(e){}reject(new Error("edge timeout"));},15000);
      ws.onopen=()=>{
        const id=(Date.now().toString(16)+Math.random().toString(16).slice(2)).replace(/[^a-f0-9]/g,"").slice(0,32).padEnd(32,"0");
        const date=new Date().toString();
        ws.send(`X-Timestamp:${date}\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n{"context":{"synthesis":{"audio":{"metadataoptions":{"sentenceBoundaryEnabled":"false","wordBoundaryEnabled":"false"},"outputFormat":"audio-24khz-48kbitrate-mono-mp3"}}}}`);
        const ratePct=rate&&rate<1?"-"+Math.round((1-rate)*100)+"%":"+0%";
        const ssml=`<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='${VLANG}'><voice name='${V}'><prosody rate='${ratePct}'>${text.replace(/[<>&]/g," ")}</prosody></voice></speak>`;
        ws.send(`X-RequestId:${id}\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:${date}Z\r\nPath:ssml\r\n\r\n${ssml}`);
      };
      ws.onmessage=ev=>{
        if(typeof ev.data==="string"){
          if(ev.data.includes("Path:turn.end")){clearTimeout(timer);try{ws.close();}catch(e){}resolve(URL.createObjectURL(new Blob(chunks,{type:"audio/mp3"})));}
        }else if(ev.data instanceof ArrayBuffer){
          const dv=new DataView(ev.data);const hlen=dv.getUint16(0);
          chunks.push(new Uint8Array(ev.data,2+hlen));
        }
      };
      ws.onerror=()=>{clearTimeout(timer);reject(new Error("edge error"));};
      ws.onclose=ev=>{ if(ev&&ev.code&&!chunks.length&&timer){} };
    }).catch(reject);
  });
}

const _ipaCache={};
async function getIpa(text){
  const w=(String(text||"").trim().split(/\s+/)[0].replace(/[^a-zA-Z']/g,"").toLowerCase());
  if(!w)return "";
  if(_ipaCache[w]!==undefined)return _ipaCache[w];
  try{
    const d=await(await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w))).json();
    let ipa=Array.isArray(d)?(d[0].phonetic||(d[0].phonetics.find(p=>p.text)||{}).text||""):"";
    ipa=ipa.replace(/\/+/g,"").replace(/[!?.,;:"()\[\]0-9]/g,"").trim();
    _ipaCache[w]=ipa;return ipa;
  }catch(e){_ipaCache[w]="";return "";}
}
const _ipaPhraseCache={};
async function getIpaPhrase(text){
  const key=String(text||"").trim().toLowerCase();
  if(_ipaPhraseCache[key]!==undefined)return _ipaPhraseCache[key];
  const words=(String(text||"").match(/[A-Za-z']+/g))||[];
  if(!words.length)return "";
  const ipas=await Promise.all(words.map(w=>getIpa(w)));
  const r=words.map((w,i)=>(ipas[i]||"").trim()||w.toLowerCase()).join(" ").trim();
  _ipaPhraseCache[key]=r;return r;
}

/* 音高判男女：对录音做自相关基频估计，中位 F0>160Hz 判女声 */
function pitchGenderF32(chunks,sr){
  try{
    if(!chunks||!chunks.length)return null;
    let total=0;for(const c of chunks)total+=c.length;
    if(total<sr*0.5)return null;
    const all=new Float32Array(total);let o=0;
    for(const c of chunks){all.set(c,o);o+=c.length;}
    const fs=[];const N=1024,HOP=Math.floor(sr/16);
    for(let st=Math.floor(total*0.2);st+HOP+N<total&&fs.length<40;st+=HOP){
      let e=0;for(let i=st;i<st+N;i++)e+=all[i]*all[i];
      if(Math.sqrt(e/N)<0.02)continue; // 跳过近静音
      let best=0,bestLag=0;
      const minLag=Math.floor(sr/300),maxLag=Math.floor(sr/70); // 70~300Hz
      for(let lag=minLag;lag<=maxLag;lag++){
        let c=0,n=0;
        for(let i=st;i<st+N-lag;i++){c+=all[i]*all[i+lag];n++;}
        c/=n;
        if(c>best){best=c;bestLag=lag;}
      }
      let nrm=0;for(let i=st;i<st+N;i++)nrm+=all[i]*all[i];
      if(bestLag&&best>(nrm/N)*0.35)fs.push(sr/bestLag);
    }
    if(fs.length<4)return null;
    fs.sort((a,b)=>a-b);
    return fs[Math.floor(fs.length/2)]>160?"f":"m";
  }catch(e){return null;}
}

function splitAnna(text){

      let end=norm.length;
      for(const e of endMarks||[]){const j=norm.indexOf(e,i+s.length);if(j>-1){end=Math.min(end,j);break;}}
      return norm.slice(i+s.length,end).replace(/^[:：\s]*/,"").trim();
    }
    return "";

  return{
    reply:norm.split(/🇨🇳|💡|🎓/)[0].trim(),

function attachDrill(el,raw){

/* ================= 跟读（自动录音→识别→鼓励式比对） ================= */
let _repBusy=false;
function normEn(s){return String(s||"").toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);}
function compareSay(target,heard){
  const T=normEn(target),H=normEn(heard);
  if(!T.length||!H.length)return 0;
  let hit=0;
  T.forEach(w=>{
    if(H.indexOf(w)>-1){hit++;return;}
    if(w.length>3&&H.some(h=>h.slice(0,4)===w.slice(0,4)))hit+=0.5; // 半对：近音词
  });
  return Math.round(hit/T.length*100);
}
function repeatGo(btn,target){
  if(_repBusy){notice("正在听您读呢，稍等一下～");return;}
  _repBusy=true;
  const row=btn.parentElement.parentElement;
  const res=row.querySelector(".rep-result");
  res.style.display="block";res.style.color="var(--muted)";
  btn.disabled=true;const oldTxt=btn.textContent;btn.textContent="🔴 正在录音…请大声跟读";
  speak(target,null,true).then(()=>{
    res.textContent="轮到您啦！大声读出来：";
    return new Promise(r=>setTimeout(r,400));
  }).then(()=>{
    // 录 4.5 秒
    return navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}}).then(stream=>{
      return new Promise((resolve,reject)=>{
        const ctx=new (window.AudioContext||window.webkitAudioContext)();
        const src=ctx.createMediaStreamSource(stream);
        const chunks=[];
        const proc=ctx.createScriptProcessor(4096,1,1);
        proc.onaudioprocess=e=>chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
        src.connect(proc);proc.connect(ctx.destination);
        setTimeout(()=>{
          try{proc.disconnect();src.disconnect();}catch(e){}
          stream.getTracks().forEach(t=>t.stop());
          try{ctx.close();}catch(e){}
          resolve({chunks,sr:ctx.sampleRate});
        },4500);
      });
    });
  }).then(({chunks,sr})=>{
    res.textContent="正在听懂您的话…";
    return iatRecognize(chunks,sr,chatMode()?"zh":"en");
  }).then(heard=>{
    const score=compareSay(target,heard);
    res.style.display="block";
    if(score>=60){res.style.color="var(--green)";res.innerHTML=pickRnd(REP_GOOD);if(Math.random()<0.4)speakCn(pickRnd(["好！就这样！","不错哟！","说得挺好！"]));}
    else if(score>=30){res.style.color="#b45309";res.innerHTML=pickRnd(REP_NEAR)+escapeHtml(heard);}
    else{res.style.color="var(--muted)";res.innerHTML=pickRnd(REP_MISS);}
  }).catch(e=>{
    res.style.display="block";res.style.color="var(--muted)";
    const em=String(e&&e.message||e);
    res.textContent=em.indexOf("麦克风")>-1||em.indexOf("permission")>-1||em.indexOf("NotAllowed")>-1
      ?"🎤 麦克风没打开：请在手机弹窗里点“允许”，然后重试"
      :"没听清您读的，再来一次吧！（第一次用会弹出麦克风权限，请点允许）";
  }).finally(()=>{
    _repBusy=false;btn.disabled=false;btn.textContent="🎤 跟读";
  });
}

/* ================= 按住说话（讯飞 IAT 听写 + 浏览器SR兜底） ================= */
let _rec=null,_recStream=null,_recChunks=[],_recStart=0,_holding=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function micDown(){
  if(_holding)return;_holding=true;
  $("micBtn").classList.add("holding");$("micBtn").textContent="🔴 正在听…请说话，说完松手";
  $("confirmBox").style.display="none";
  // 优先浏览器原生识别（识别快、自动断句）
  if(SR){
    try{
      _rec=new SR();_rec.lang=micLang();_rec.interimResults=false;_rec.maxAlternatives=1;
      _rec.onresult=e=>{const t=e.results[0][0].transcript;showConfirm(t);};
      _rec.onerror=e=>{
        _rec=null;
        if(e.error==="no-speech")toast("没听到声音，再试一次吧 🎤");
        else toast("语音识别暂时用不了（"+e.error+"）。\n\n可以改用下面的输入框：点一下，用键盘上的 🎤 语音输入");
      };
      _rec.onend=()=>{if(_holding){_holding=false;micReset();}};
      _rec.start();_recStart=Date.now();
      return;
    }catch(e){/* 掉到 IAT */}
  }
  iatDown();
}
let _recBroken=false;
function micUp(){
  if(!_holding)return;_holding=false;
  micReset();
  const held=Date.now()-_recStart;
  if(SR&&_rec){ setTimeout(()=>{try{_rec&&_rec.stop();}catch(e){}},held<700?700-held:0); return; }
  /* IAT 路径：松手后把录到的音频送去识别 */
  const chunks=(window._iatChunks||[]).slice();
  const sr=_iac?_iac.sampleRate:16000;
  stopIat();
  if(!chunks.length){toast("没听到声音，请再按住说一次 🎤");return;}
  $("thinking").style.display="block";
  iatRecognize(chunks,sr,chatMode()?"zh":"en").then(t=>{
    $("thinking").style.display="none";
    showConfirm(t);
  }).catch(e=>{
    $("thinking").style.display="none";
    const em=String(e&&e.message||e);
    if(em.indexOf("识别连接失败")>-1||em.indexOf("超时")>-1)toast("语音服务连不上（"+em+"）。\n\n请检查手机网络，或稍后再试一次。");
    else if(em.indexOf("太短")>-1)toast("按住的时间太短啦，按住后说完一句话再松手 🎤");
    else toast("没听清，再按住说一次吧 🎤（"+em+"）");
  });
}
function toast(msg){alert(msg);}
/* —— 讯飞 IAT：按住期间持续录音，松手后识别 —— */
let _iatWs=null,_iac=null;
async function iatDown(){
  try{
    _recStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
    if(!_holding){stopStream();return;}
    _iac=new (window.AudioContext||window.webkitAudioContext)();
    await _iac.resume();
    const src=_iac.createMediaStreamSource(_recStream);
    const proc=_iac.createScriptProcessor(4096,1,1);
    const chunks=[];
    proc.onaudioprocess=e=>{if(_holding)chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));};
    src.connect(proc);proc.connect(_iac.destination);
    window._iatProc=proc;window._iatSrc=src;window._iatChunks=chunks;
  }catch(e){
    toast("打开麦克风失败了。\n\n解决办法：\n① 允许本页面使用麦克风\n② 或用下面的输入框，点一下用键盘上的 🎤 语音");
    micReset();
  }
}
function stopStream(){
  try{window._iatProc&&window._iatProc.disconnect();}catch(e){}
  try{window._iatSrc&&window._iatSrc.disconnect();}catch(e){}
  try{_recStream&&_recStream.getTracks().forEach(t=>t.stop());}catch(e){}
  try{_iac&&_iac.close();}catch(e){}
  _recStream=null;_iac=null;
}
function stopIat(){
  if(_iatWs){try{_iatWs.close();}catch(e){}_iatWs=null;}
  stopStream();
}
function micReset(){$("micBtn").classList.remove("holding");$("micBtn").textContent=chatMode()?"🎤 按住说话（说中文）":"🎤 按住说话（说英语）";}
function micCancel(){
  if(SR&&_rec){try{_rec.onresult=null;_rec.onend=null;_rec.stop();}catch(e){}_rec=null;}
  stopIat();_holding=false;micReset();
}
function iatRecognize(chunks,sr,lang){
  return new Promise((resolve,reject)=>{
    // 合并+重采样 16k
    const total=chunks.reduce((a,c)=>a+c.length,0);
    if(total<sr*0.4)return reject(new Error("太短"));
    const all=new Float32Array(total);let o=0;
    for(const c of chunks){all.set(c,o);o+=c.length;}
    let f32=all;
    if(sr!==16000){
      const n=Math.round(total*16000/sr),out=new Float32Array(n);
      for(let i=0;i<n;i++){const t=i*(sr/16000);const i0=Math.min(Math.floor(t),total-1),i1=Math.min(i0+1,total-1);out[i]=all[i0]+(all[i1]-all[i0])*(t-i0);}
      f32=out;
    }
    const pcm=new Int16Array(f32.length);
    for(let i=0;i<f32.length;i++){const s=Math.max(-1,Math.min(1,f32[i]));pcm[i]=s<0?s*0x8000:s*0x7fff;}
    // 签名
    const HOST="iat-api.xfyun.cn",PATH="/v2/asm";
    const date=new Date().toUTCString();
    const origin=`host: ${HOST}\ndate: ${date}\nGET ${PATH} HTTP/1.1`;
    crypto.subtle.importKey("raw",new TextEncoder().encode(state.xfSecret),{name:"HMAC",hash:"SHA-256"},false,["sign"]).then(k=>
      crypto.subtle.sign("HMAC",k,new TextEncoder().encode(origin))
    ).then(sigBuf=>{
      const sig=new Uint8Array(sigBuf);
      let sigs="";sig.forEach(b=>sigs+=String.fromCharCode(b));
      const auth=btoa(`api_key="${state.xfKey}", algorithm="hmac-sha256", headers="host date request-line", signature="${btoa(sigs)}"`);
      const url=`wss://${HOST}${PATH}?authorization=${encodeURIComponent(auth)}&date=${encodeURIComponent(date)}&host=${HOST}`;
      let ws;try{ws=new WebSocket(url);}catch(e){return reject(e);}
      _iatWs=ws;ws.binaryType="arraybuffer";
      const timer=setTimeout(()=>{try{ws.close();}catch(e){}reject(new Error("识别超时"));},25000);
      let text="";let sentAll=false;
      const LANG=lang==="zh"?"zh_cn":"en_us";
      const b64e=bytes=>{let s="";const u=new Uint8Array(bytes);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
      ws.onopen=()=>{
        ws.send(JSON.stringify({common:{app_id:state.xfAppid},business:{language:LANG,domain:"iat",accent:"mandarin",vad_eos:10000,dwa:"wpgs"},data:{status:0,format:"audio/L16;rate=16000",encoding:"raw",audio:""}}));
        const BYTES=1280;let off=0;
        const iv=setInterval(()=>{
          if(ws.readyState!==1){clearInterval(iv);return;}
          if(off>=pcm.length*2){
            if(!sentAll){sentAll=true;ws.send(JSON.stringify({business:{cmd:"auw",aus:4},data:{status:2,encoding:"raw",format:"audio/L16;rate=16000",audio:""}}));}
            clearInterval(iv);return;
          }
          const end=Math.min(off+BYTES,pcm.length*2);
          ws.send(JSON.stringify({business:{cmd:"auw",aus:2},data:{status:1,encoding:"raw",format:"audio/L16;rate=16000",audio:b64e(pcm.buffer.slice(off,end))}}));
          off=end;
        },40);
      };
      ws.onmessage=ev=>{
        if(typeof ev.data!=="string")return;
        const j=JSON.parse(ev.data);
        if(j.code&&j.code!==0){clearTimeout(timer);try{ws.close();}catch(e){}reject(new Error("识别失败 "+j.code));return;}
        if(j.data&&j.data.result){
          const r=j.data.result;
          if(r.ws)r.ws.forEach(w=>w.cw.forEach(c=>{text+=c.w;}));
        }
        if(j.data&&j.data.status===2){clearTimeout(timer);try{ws.close();}catch(e){}resolve(text.replace(/\s+/g," ").trim());}
      };
      ws.onerror=()=>{clearTimeout(timer);reject(new Error("识别连接失败"));};
      ws.onclose=()=>{clearInterval(0);};
    }).catch(reject);
  });
}
function showConfirm(text){
  if(!text){toast("没听清您说的话，再试一次吧 🎤");return;}
  $("confirmTxt").textContent=text;

  $("okBtn").onclick=()=>{
    $("confirmBox").style.display="none";

  $("retryBtn").onclick=()=>{$("confirmBox").style.display="none";toast("好，再按住麦克风说一次");};
}
